[package]
name = "cargo-material-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Interactive multi-platform project and build CLI for material-ui-rs"
license = "MIT"
repository = "https://github.com/moeleak/material-ui-rs"

[[bin]]
name = "cargo-material-ui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cliclack = "0.5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "deny"
unused_results = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
